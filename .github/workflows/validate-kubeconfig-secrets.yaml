name: Validate Kubeconfig Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  validate-hcl-daily:
    name: Validate HCL_DAILY_KUBECONFIG
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.HCL_DAILY_KUBECONFIG }}" | base64 -d > ~/.kube/hcl-daily.yaml
          chmod 600 ~/.kube/hcl-daily.yaml
          export KUBECONFIG=~/.kube/hcl-daily.yaml

          echo "✅ Secret decoded successfully"

          # Validate it's valid YAML
          if ! grep -q "apiVersion:" ~/.kube/hcl-daily.yaml; then
            echo "❌ Not a valid kubeconfig (missing apiVersion)"
            exit 1
          fi
          echo "✅ Valid kubeconfig structure"

          # Test cluster connectivity
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "❌ Cannot connect to cluster"
            kubectl cluster-info
            exit 1
          fi
          echo "✅ Successfully connected to cluster"

          # Verify it's the HCL cluster
          CLUSTER_INFO=$(kubectl cluster-info)
          echo "${CLUSTER_INFO}"
          if echo "${CLUSTER_INFO}" | sed 's/\x1b\[[0-9;]*m//g' | grep -qF "10.190.252.83:8443"; then
            echo "✅ Confirmed: HCL daily cluster (10.190.252.83:8443)"
          else
            echo "❌ Wrong cluster! Expected 10.190.252.83:8443"
            exit 1
          fi

          # Test namespace access
          if ! kubectl get namespace videocall >/dev/null 2>&1; then
            echo "⚠️  Warning: videocall namespace not found (may not exist yet)"
          else
            echo "✅ Can access videocall namespace"
          fi

  validate-labsworkspace:
    name: Validate LABSWORKSPACE_KUBECONFIG
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.LABSWORKSPACE_KUBECONFIG }}" | base64 -d > ~/.kube/labsworkspace.yaml
          chmod 600 ~/.kube/labsworkspace.yaml
          export KUBECONFIG=~/.kube/labsworkspace.yaml

          echo "✅ Secret decoded successfully"

          # Validate it's valid YAML
          if ! grep -q "apiVersion:" ~/.kube/labsworkspace.yaml; then
            echo "❌ Not a valid kubeconfig (missing apiVersion)"
            exit 1
          fi
          echo "✅ Valid kubeconfig structure"

          # Test cluster connectivity
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "❌ Cannot connect to cluster"
            kubectl cluster-info
            exit 1
          fi
          echo "✅ Successfully connected to cluster"

          # Verify it's the labsworkspace cluster
          CLUSTER_INFO=$(kubectl cluster-info)
          echo "${CLUSTER_INFO}"
          if echo "${CLUSTER_INFO}" | sed 's/\x1b\[[0-9;]*m//g' | grep -qF "k3s.labsworkspace.fnxlabs.com:6443"; then
            echo "✅ Confirmed: labsworkspace cluster (k3s.labsworkspace.fnxlabs.com:6443)"
          else
            echo "❌ Wrong cluster! Expected k3s.labsworkspace.fnxlabs.com:6443"
            exit 1
          fi

          # Test namespace access
          if ! kubectl get namespace videocall >/dev/null 2>&1; then
            echo "⚠️  Warning: videocall namespace not found (may not exist yet)"
          else
            echo "✅ Can access videocall namespace"
          fi

  validate-ascend:
    name: Validate ASCEND_KUBECONFIG
    runs-on: [self-hosted, linux, ascend]
    steps:
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.ASCEND_KUBECONFIG }}" | base64 -d > ~/.kube/ascend.yaml
          chmod 600 ~/.kube/ascend.yaml
          export KUBECONFIG=~/.kube/ascend.yaml

          echo "✅ Secret decoded successfully"

          # Validate it's valid YAML
          if ! grep -q "apiVersion:" ~/.kube/ascend.yaml; then
            echo "❌ Not a valid kubeconfig (missing apiVersion)"
            exit 1
          fi
          echo "✅ Valid kubeconfig structure"

          # Test cluster connectivity
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "❌ Cannot connect to cluster"
            kubectl cluster-info
            exit 1
          fi
          echo "✅ Successfully connected to cluster"

          # Verify it's the Ascend cluster
          CLUSTER_INFO=$(kubectl cluster-info)
          echo "${CLUSTER_INFO}"
          if echo "${CLUSTER_INFO}" | sed 's/\x1b\[[0-9;]*m//g' | grep -qF "10.244.8.238:6443"; then
            echo "✅ Confirmed: Ascend cluster (10.244.8.238:6443)"
          else
            echo "❌ Wrong cluster! Expected 10.244.8.238:6443"
            exit 1
          fi

          # Test namespace access
          if ! kubectl get namespace videocall >/dev/null 2>&1; then
            echo "⚠️  Warning: videocall namespace not found (may not exist yet)"
          else
            echo "✅ Can access videocall namespace"
          fi

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-hcl-daily, validate-labsworkspace, validate-ascend]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "=================================================="
          echo "Kubeconfig Secret Validation Results"
          echo "=================================================="
          echo ""
          echo "HCL_DAILY_KUBECONFIG:      ${{ needs.validate-hcl-daily.result }}"
          echo "LABSWORKSPACE_KUBECONFIG:  ${{ needs.validate-labsworkspace.result }}"
          echo "ASCEND_KUBECONFIG:         ${{ needs.validate-ascend.result }}"
          echo ""

          if [ "${{ needs.validate-hcl-daily.result }}" = "success" ] && \
             [ "${{ needs.validate-labsworkspace.result }}" = "success" ] && \
             [ "${{ needs.validate-ascend.result }}" = "success" ]; then
            echo "✅ All kubeconfig secrets validated successfully!"
            exit 0
          else
            echo "❌ One or more secrets failed validation"
            exit 1
          fi
